[package]
name = "aether-cloudlink"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Transport-neutral experimental CloudLink protocol foundation"
license.workspace = true
repository.workspace = true
documentation = "https://docs.aetheriot.dev/crates/aether-cloudlink"
readme = "README.md"
keywords = ["iot", "edge", "gateway", "mqtt"]
categories = ["embedded", "network-programming"]

[dependencies]
aether-domain = { version = "0.0.1", path = "../aether-domain" }
aether-ports = { version = "0.0.1", path = "../aether-ports" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
aether-runtime-catalog = { path = "../../libs/aether-runtime-catalog" }
async-trait = { workspace = true }
aether-store-local = { path = "../../libs/aether-store-local" }
aether-testkit = { path = "../aether-testkit" }
tokio = { workspace = true }

[lints]
workspace = true
