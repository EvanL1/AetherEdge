[package]
name = "aether-ports"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Object-safe capability ports for Aether edge adapters"
license.workspace = true
repository.workspace = true
documentation = "https://docs.aetheriot.dev/crates/aether-ports"
readme = "README.md"
keywords = ["iot", "edge", "gateway", "ports"]
categories = ["embedded", "asynchronous"]

[dependencies]
aether-domain = { version = "0.0.1", path = "../aether-domain" }
async-trait = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
url = "2.5.8"
uuid = { workspace = true, features = ["v5"] }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
