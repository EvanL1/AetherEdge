[package]
name = "aether-application"
version.workspace = true
edition = "2024"
rust-version = "1.90"
description = "Transport-neutral commands, queries, and safety policy for Aether"
license.workspace = true
repository.workspace = true
documentation = "https://docs.aetheriot.dev/crates/aether-application"
readme = "README.md"
keywords = ["iot", "edge", "gateway", "automation"]
