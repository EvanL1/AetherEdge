thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
aether-store-local = { path = "../../libs/aether-store-local" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_yml = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
