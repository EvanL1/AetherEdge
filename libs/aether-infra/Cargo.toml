[package]
name = "aether-infra"
publish = false
version.workspace = true
edition = "2024"
description = "Infrastructure layer for AetherEdge (SQLite)"

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx", "dep:serde_yml"]

[dependencies]
# SQLite (optional)
sqlx = { workspace = true, optional = true }
serde_yml = { workspace = true, optional = true }

# Common dependencies
anyhow = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
