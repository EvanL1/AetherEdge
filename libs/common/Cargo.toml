[package]
name = "common"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true

[features]
default = ["sqlite", "axum", "openapi"]
sqlite = ["dep:sqlx"]
axum = ["dep:axum"]
openapi = ["dep:utoipa"]
schema = ["dep:schemars", "aether-core/schema"]

[dependencies]
errors = { path = "../errors", default-features = false }
aether-core = { path = "../aether-core", features = ["serde"] }
aether-schema-macro = { path = "../aether-schema-macro" }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "json",
    "fmt",
] }
tracing-appender = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
anyhow = { workspace = true }
flate2 = { workspace = true }
csv = { workspace = true }
axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
sysinfo = "0.32"

# SQLite - kept for direct usage in schema and service_config
sqlx = { workspace = true, optional = true }

# Schema generation
schemars = { version = "0.8", optional = true }

[dev-dependencies]

[lints]
workspace = true
