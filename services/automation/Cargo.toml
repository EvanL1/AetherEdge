[package]
name = "aether-automation"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true
description = "Real-time model execution service"

[lib]
name = "aether_automation"
path = "src/lib.rs"

[[bin]]
name = "aether-automation"
path = "src/main.rs"
test = false

[dependencies]
# Local dependencies
common = { path = "../../libs/common", default-features = false, features = ["sqlite", "axum"] }
aether-application = { path = "../../crates/aether-application" }
aether-auth-jwt = { path = "../../libs/aether-auth-jwt" }
aether-pack = { path = "../../crates/aether-pack" }
aether-runtime-catalog = { path = "../../libs/aether-runtime-catalog" }
aether-domain = { path = "../../crates/aether-domain" }
aether-ports = { path = "../../crates/aether-ports" }
aether-routing = { path = "../../libs/aether-routing" }
aether-store-local = { path = "../../libs/aether-store-local", features = ["sqlite-audit", "sqlite-routing"] }
aether-shm-bridge = { path = "../../libs/aether-shm-bridge" }
aether-rules = { path = "../../libs/aether-rules" }

# Core dependencies (use aether-common where possible)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
# cron removed - not currently used
arc-swap = "1.7"  # ArcSwapOption for runtime-swappable SHM writer
tower = { workspace = true }
reqwest = { workspace = true }
subtle = "2.6"

[dev-dependencies]
# criterion removed - no benchmarks
tempfile = { workspace = true }
http-body-util = "0.1"
jsonwebtoken = "9"

[features]
default = ["sqlite", "openapi"]
sqlite = []
# Service-local OpenAPI is consumed by the gateway-owned Swagger UI.
openapi = ["common/openapi"]

[lints]
workspace = true
