[package]
name = "aether-api"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "aether-api"
path = "src/main.rs"

[dependencies]
# Local libraries
common = { path = "../../libs/common", default-features = false, features = ["sqlite", "axum"] }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Utilities
chrono = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }

# JWT authentication
jsonwebtoken = "9"

# Password hashing (bcrypt - frontend sends MD5, backend stores bcrypt(MD5))
bcrypt = "0.15"
md-5 = "0.10"

# OpenAPI / Swagger UI
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }

[features]
default = ["openapi"]
openapi = ["common/openapi"]
# The only deployed Swagger UI; it presents gateway-proxied service specs.
swagger-ui = ["openapi", "dep:utoipa-swagger-ui"]

[dev-dependencies]
tower = { workspace = true }

[lints]
workspace = true
