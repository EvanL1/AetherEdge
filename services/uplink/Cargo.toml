[package]
name = "aether-uplink"
publish = false
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "aether-uplink"
path = "src/main.rs"

[dependencies]
# Local libraries
common = { path = "../../libs/common", default-features = false, features = ["sqlite", "axum"] }
aether-cloudlink = { path = "../../crates/aether-cloudlink" }
aether-cloudlink-mqtt = { path = "adapters/cloudlink-mqtt" }
aether-domain = { path = "../../crates/aether-domain" }
aether-ports = { path = "../../crates/aether-ports" }
aether-store-local = { path = "../../libs/aether-store-local" }
aether-sqlite-topology = { path = "../../libs/aether-sqlite-topology" }
aether-shm-bridge = { path = "../../libs/aether-shm-bridge" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Web framework
axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# Error handling
anyhow = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6"

# Logging
tracing = { workspace = true }

# Utilities
base64 = "0.22"
rand = { workspace = true }
regex = { workspace = true }
arc-swap = "1.7"

# OpenAPI / Swagger UI
utoipa = { workspace = true }

[features]
default = ["openapi"]
openapi = ["common/openapi"]

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
